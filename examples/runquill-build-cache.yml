name: Runquill cached Docker build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ format('runquill-{0}-{1}-docker-build', github.run_id, github.run_attempt) }}
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build with GitHub Actions cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          tags: runquill-app:ci
          cache-from: type=gha,version=2,scope=runquill-app
          cache-to: type=gha,version=2,scope=runquill-app,mode=max,ignore-error=true
      - name: Check the local image
        run: docker image inspect runquill-app:ci --format '{{.Id}}'
