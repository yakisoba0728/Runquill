                  $ref: '#/components/schemas/AuditEvent'
        '400':
          description: 'Body "Use a valid audit filter and page."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/backup:
