      operationId: openMigration
      tags: [migrate]
      summary: Recomputes the preview and, if its hash still matches, opens one pull request on a new branch. Audited as migrate.request, then migrate.open or migrate.failed.
      description: Creates the branch from the default branch head, commits each changed workflow file, and opens a pull request against the default branch. It never merges, never pushes to an existing branch and never writes outside .github/workflows. If a commit or the pull request fails, the new branch is deleted. Allowed up to 90 seconds.
      x-runquill-permission: admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationOpenRequest'
      responses:
        '201':
          description: The pull request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationPullRequest'
        '400':
          description: 'An invalid JSON body (plain text "Invalid JSON request."), or a JSON MigrationError with code mapping, repository, hash, public or too_many.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationError'
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'The Forbidden cases common to every route (plain text), or a JSON MigrationError with code scope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationError'
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Code permissions, stale, nothing, branch_exists or installation_scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationError'
        '415':
          $ref: '#/components/responses/NotJSON'
        '429':
          $ref: '#/components/responses/Busy'
        '502':
          description: Code github; the new branch, if any, was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationError'
        '503':
          description: 'Body "GitHub is not configured.", "Could not prepare the request.", "Could not record the request." or "Could not check panel access."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
