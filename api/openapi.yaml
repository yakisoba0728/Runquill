          description: The next scheduler pass may start the job.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Body "This job is no longer waiting for a runner." or "This job has no retry delay to clear."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'Body "Could not update the job." or "Could not check panel access."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/hosts/cordon:
    post:
      operationId: setHostCordon
      tags: [hosts]
      summary: Pauses or resumes new assignments to a host. Audited as host.cordon or host.uncordon.
