        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CordonRequest'
      responses:
        '204':
          description: Updated.
        '400':
          description: 'Body "Invalid JSON request." or "Choose a host and maintenance state."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Body "This host has no current observation."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/NotJSON'
        '503':
          description: 'Body "Could not update the host." or "Could not check panel access."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/hosts/{name}/enrollment:
    post:
      operationId: createWorkerEnrollment
      tags: [hosts]
      summary: Issues a one-time enrollment command for a preconfigured outbound worker. Audited as worker.enrollment.create.
      x-runquill-permission: admin
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          description: The configured outbound worker name without the agent scheme.
          schema:
            type: string
      responses:
        '201':
          description: 'Copy the returned enrollment command to the worker. Issuing a new code replaces the previous one.'
          content:
            application/json:
              schema:
                type: object
                required: [command, start_command, expires_at]
                properties:
                  command:
                    type: string
                    description: One-line shell command containing a single-use code.
                  start_command:
                    type: string
                    description: Command to start the worker again using its saved token file.
                  expires_at:
                    type: string
                    format: date-time
        '400':
          description: The name is not a configured outbound worker.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /snapshot:
    get:
      operationId: getSnapshot
      tags: [fleet]
      summary: Latest fleet sample taken by the scheduler.
      x-runquill-permission: fleet:read
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: Snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/events:
    get:
      operationId: streamSnapshots
      tags: [fleet]
      summary: Server-Sent Events stream of the fleet snapshot.
      description: 'Sends "retry: 3000", then a snapshot event (an id line, "event: snapshot" and one data line holding the same JSON as GET /snapshot) whenever the snapshot changes; changes are checked every 2 seconds. A ": ping" comment follows every 15 seconds without a change. The server ends each stream after 10 minutes so the client reconnects and is authorized again. At most 64 streams are open per manager and 4 per user. Event ids increase across manager restarts.'
      x-runquill-permission: fleet:read
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: Last-Event-ID
          in: header
          description: The last event id received; an event with this id is not sent again.
          schema:
            type: string
      responses:
        '200':
          description: The event stream. X-Accel-Buffering is no.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                snapshot:
                  value: "retry: 3000\n\nid: 1784000000001\nevent: snapshot\ndata: {\"fleet\":null}\n\n"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: 'Body "Too many live connections. Close another panel tab and try again."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/runners/{name}/logs:
    get:
      operationId: getRunnerLogs
      tags: [logs]
      summary: Container output of an active runner on a local or ssh:// Docker host. Audited as runner.logs.
      description: 'Runs docker logs --timestamps, or podman logs with RUNQUILL_CONTAINER_ENGINE=podman, for a runner that currently holds a job in the queue. Requires a signed-in operator or administrator; viewers and API tokens are refused. Without follow the last tail lines are returned at once (20 second limit). With follow the response streams new lines for up to 15 minutes. Output stops at 8 MiB with a marker line, and runs of 200 or more base64 characters are replaced by [redacted]. At most 8 log requests run at once. Kubernetes and agent:// runners have no logs here. These are the runner process logs, not the GitHub step logs.'
      x-runquill-permission: browser
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          description: Runner name from runner_inventory.
          schema:
            type: string
            pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$'
        - name: tail
          in: query
          description: Lines to return from the end of the log; values above 2000 are reduced to 2000.
          schema:
            type: integer
            minimum: 0
            default: 200
        - name: follow
          in: query
          schema:
            type: string
            enum: ['0', '1', 'false', 'true']
            default: '0'
      responses:
        '200':
          description: Log lines, each prefixed with its timestamp.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: 'Body "Use a tail between 0 and 2000 lines." or "Use follow=1 or follow=0."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'A viewer, an API token, or a session whose role changed ("You do not have access to this operation." or "Could not authorize the runner logs."), or the Forbidden cases common to every route.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Body "This runner is not active in Runquill."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Body "Too many runner log streams are open. Try again shortly."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: The runner runs on Kubernetes, an agent:// worker or another unsupported host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerLogUnavailable'
        '502':
          description: 'The docker command failed. Body "Could not read the runner logs."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'Body "Could not read the runner." or "Could not check panel access."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/hosts/resources:
    get:
      operationId: getHostResources
      tags: [hosts]
      summary: CPU and memory per host, runner reservations, sampled usage and, on request, disk use of runner images and cache volumes.
      x-runquill-permission: fleet:read
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: disk
          in: query
          required: false
          description: 1 measures disk use unless a measurement younger than 10 minutes exists, or 1 minute when a host could not be measured. One measurement runs at a time for every caller; the request waits up to 3 seconds and otherwise returns with disk_measuring true.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: The current report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostResourcesReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/elastic:
