      operationId: getUsage
      tags: [usage]
      summary: Finished-job statistics by UTC day, repository, pool or host.
      description: Combines the daily rollup, kept for 400 UTC days, with finished jobs not yet rolled up. A job counts on the UTC day it finished.
      x-runquill-permission: fleet:read
      security:
