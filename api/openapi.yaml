        '400':
          $ref: '#/components/responses/BadJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/NotJSON'
        '429':
          $ref: '#/components/responses/Busy'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/settings:
    get:
      operationId: getSettings
