  /mcp:
    post:
      operationId: callMCP
      tags: [mcp]
      summary: Read-only Model Context Protocol endpoint for agents. API tokens with the fleet:read scope only; browser sessions are always refused.
      description: 'Accepts one JSON-RPC message per request (body at most 64 KiB) and answers application/json; there is no event stream and no session, so GET and DELETE answer 405. Protocol revision 2026-07-28 is served statelessly: each request carries _meta io.modelcontextprotocol/protocolVersion and io.modelcontextprotocol/clientCapabilities, the MCP-Protocol-Version and Mcp-Method headers, and Mcp-Name for tools/call. Clients that start with initialize get revision 2025-11-25 and must send MCP-Protocol-Version on later requests. Tools are fleet_status, list_jobs, get_job, list_hosts, usage_summary, elastic_decisions, job_rightsizing and pool_rightsizing. At most 4 requests run at once and each is limited to 5 seconds. A present Origin header must equal the panel origin.'
      x-runquill-permission: fleet:read
      security:
        - bearerToken: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          schema:
            type: string
            enum: ['2026-07-28', '2025-11-25']
        - name: Mcp-Method
          in: header
          description: Required with revision 2026-07-28; must equal the JSON-RPC method.
          schema:
            type: string
        - name: Mcp-Name
          in: header
          description: Required for tools/call with revision 2026-07-28; the tool name, base64 encoded as =?base64?...?= when not plain ASCII.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCMessage'
      responses:
        '200':
          description: A JSON-RPC response. Legacy-revision protocol errors such as an unknown method also use 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '202':
          description: A notification was accepted; no body.
        '400':
          description: Malformed JSON-RPC, a batch, invalid params, a missing _meta field, a header that does not match the message, or an unsupported protocol version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '401':
          description: 'No Authorization header, including any cookie-only request (JSON-RPC error "Use a Runquill API token with the fleet:read scope."), or an invalid or expired token (plain text "Sign in to Runquill.").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'A foreign Origin (JSON-RPC error), or a token whose scope is not fleet:read or a wrong Host header (plain text).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown method with revision 2026-07-28 (code -32601).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '413':
          description: The body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '415':
          description: The Content-Type is not application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '429':
          description: Four MCP requests are already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '500':
          description: The server could not encode the MCP response (code -32603).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
