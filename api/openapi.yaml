          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Stale revision ("Settings were changed in another session. Reload them and try again."), a concurrent update, or a worker that is still in use.'
