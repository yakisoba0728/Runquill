          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RightsizingReport'
        '400':
          description: 'Body "Use group pool or job and days from 1 to 7."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 'Body "Could not read job resources." or "Could not check panel access."'
