# Hand-written description of every route the Runquill panel serves.
# openapi_test.go checks it against the registered routes, their permissions
# and the Go structs the handlers encode. Keep values single-line and quote any
# value that contains ": " or starts with a YAML indicator character.
openapi: 3.1.0
info:
  title: Runquill panel API
  version: '1'
  description: 'JSON API of the Runquill web panel. Errors are plain text (text/plain; charset=utf-8): the body is one English sentence followed by a newline. Exceptions are documented per operation: workflow migration failures and unavailable runner logs answer JSON with an error field, and /mcp answers JSON-RPC error objects. Every response carries Cache-Control no-store. A request whose Host header differs from the configured RUNQUILL_PANEL_URL host is refused with 403 before routing.'
servers:
  - url: '{origin}'
    variables:
      origin:
        default: http://127.0.0.1:8081
        description: The RUNQUILL_PANEL_URL origin (HTTPS, or HTTP on loopback).
tags:
  - name: assets
  - name: auth
  - name: fleet
  - name: jobs
  - name: hosts
  - name: team
  - name: tokens
  - name: operations
  - name: usage
  - name: logs
  - name: migrate
  - name: backups
  - name: mcp
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rq_session
      description: 'Browser session from GitHub sign-in, 12 hours. Named rq_session when the panel URL is plain HTTP on loopback. Requests other than GET and HEAD must carry an Origin header equal to the panel origin.'
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: rqk_ followed by 43 base64url characters
      description: 'API token from POST /api/tokens. A token has exactly one scope and may call only operations whose x-runquill-permission equals that scope; the owner must still hold a role that grants it. Tokens are exempt from the Origin check. Operations with permission browser or admin never accept a token.'
  responses:
    Unauthorized:
      description: 'No valid session or token. Body "Sign in to Runquill."'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'The role or token scope does not grant this operation ("You do not have access to this operation."), a session request lacked the panel Origin ("The request must come from the panel origin."), or the Host header is not the panel host ("Use the configured panel address.").'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    AccessUnavailable:
      description: 'The queue database could not be read ("Could not check panel access.") or the operation failed with a handler-specific message.'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    BadJSON:
      description: 'The body is not one JSON object with only the documented fields ("Invalid JSON request."), or a field value is invalid.'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    NotJSON:
      description: 'The Content-Type is not application/json. Body "Send application/json."'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Busy:
      description: 'Another backup, diagnosis or workflow migration is running. Body "Another operation is running. Try again shortly."'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found. Path IDs that are not positive integers answer with the router's "404 page not found".
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The change conflicts with the current state; the body says why.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Asset:
      description: Embedded panel asset.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Error:
      type: string
      description: One English sentence followed by a newline.
      examples:
        - "Sign in to Runquill.\n"
    Identity:
      type: object
      required: [github_id, login, role]
      properties:
        github_id:
          type: integer
          format: int64
        login:
          type: string
        role:
          type: string
          enum: [viewer, operator, admin]
    TeamMember:
      type: object
      required: [github_id, login, role, disabled]
      properties:
        github_id:
          type: integer
          format: int64
        login:
          type: string
          description: Empty until the member signs in or is added by login.
        role:
          type: string
          enum: [viewer, operator, admin]
        disabled:
          type: boolean
    TeamMemberCreate:
      type: object
      additionalProperties: false
      required: [login, role]
      properties:
        login:
          type: string
          description: GitHub login, optionally prefixed with @. Organizations and bots are refused.
        role:
          type: string
          enum: [viewer, operator, admin]
    TeamMemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [viewer, operator, admin]
        disabled:
          type: boolean
          description: Disabling also deletes the member's sessions and API tokens.
    Token:
      type: object
      required: [id, user_id, name, scope, expires_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        name:
          type: string
        scope:
          $ref: '#/components/schemas/TokenScope'
        expires_at:
          type: integer
          format: int64
          description: Unix seconds.
    TokenScope:
      type: string
      enum: ['fleet:read', 'hosts:write', 'jobs:write']
      description: 'fleet:read can call GET /snapshot, GET /api/events, GET /api/jobs, GET /api/jobs/{id}, GET /api/elastic, GET /api/hosts/resources, GET /api/usage, GET /api/usage/rightsizing and POST /mcp; hosts:write can call POST /api/hosts/cordon; jobs:write can call POST /api/jobs/{id}/cancel and POST /api/jobs/{id}/retry. A token reaches only its own scope, so a hosts:write or jobs:write token cannot read the fleet. hosts:write and jobs:write need an operator or admin owner.'
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name, scope, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scope:
          $ref: '#/components/schemas/TokenScope'
        days:
          type: integer
          minimum: 1
          maximum: 90
    TokenCreated:
      description: The new token. The secret is shown only in this response.
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 'Send as "Authorization: Bearer <secret>".'
    AuditEvent:
      type: object
      required: [id, actor, action, target, occurred_at]
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: integer
          format: int64
          description: GitHub ID of the acting user.
        actor_login:
          type: string
        action:
          type: string
          examples: [job.cancel, host.cordon, token.create, settings.update]
        target:
          type: string
        occurred_at:
          type: integer
          format: int64
          description: Unix seconds.
    HistoryJob:
      type: object
      required: [id, repository, runner_label, outcome]
      properties:
        id:
          type: integer
          format: int64
          description: GitHub Actions job ID.
        repository:
          type: string
        runner_label:
          type: string
        pool:
          type: string
        runner_os:
          type: string
          description: OS NAME the runner label selects with os__NAME__ (for example ubuntu2204), when it selects one.
        host:
          type: string
        outcome:
          type: string
          enum: [waiting, running, finished, failed]
        failure:
          type: string
        retry_reason:
          type: string
        retry_at:
          type: string
          format: date-time
        queued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        cleaned_at:
          type: string
          format: date-time
        wait_seconds:
          type: integer
          format: int64
        url:
          type: string
        diagnostic:
          $ref: '#/components/schemas/JobDiagnostic'
        timing:
          $ref: '#/components/schemas/JobTiming'
        resources:
          $ref: '#/components/schemas/JobResources'
    JobResources:
      type: object
      description: Only GET /api/jobs/{id} and the MCP get_job tool include it, when anything was recorded. Fields that were not measured are absent; usage is sampled only on the local Docker host.
      required: [samples]
      properties:
        samples:
          type: integer
          format: int64
          description: docker stats samples taken while the runner ran.
        cpu_limit:
          type: number
          description: The runner's guaranteed CPUs as first sampled; 0 is unlimited.
        memory_limit_mib:
          type: integer
          format: int64
          description: The runner's guaranteed memory as first sampled; 0 is unlimited.
        cpu_limit_max:
          type: number
          description: The highest effective CPU limit sampled, above cpu_limit after an elastic raise; 0 is unlimited.
        memory_limit_max_mib:
          type: integer
          format: int64
          description: The highest effective memory limit sampled, above memory_limit_mib after an elastic raise; 0 is unlimited.
        cpu_peak:
          type: number
          description: Highest sampled CPU use in cores.
        cpu_average:
          type: number
          description: Mean of the CPU samples in cores.
        memory_peak_mib:
          type: integer
          format: int64
          description: Highest sampled memory use, a snapshot rather than a cgroup high-water mark.
        oom_killed:
          type: boolean
          description: Whether the container engine or Kubernetes killed the runner for memory. Absent when the exit was not checked, as on outbound agents.
    RightsizingResource:
      type: object
      required: [limit, peak_max, verdict]
      properties:
        limit:
          type: number
          description: The newest sampled job's limit, in cores or MiB; 0 is unlimited.
        peak_max:
          type: number
          description: The largest peak of the group, in cores or MiB.
        peak_ratio:
          type: number
          description: The largest peak divided by its own job's limit, over jobs with a limit.
        verdict:
          type: string
          enum: [oversized, tight, ok, too_few_jobs, unlimited]
          description: oversized when at least 3 jobs were sampled and peak_ratio is below 0.25; tight when peak_ratio is above 0.8 or, for memory, a runner was killed for memory.
    RightsizingGroup:
      type: object
      required: [key, jobs, sampled_jobs, oom_kills]
      properties:
        key:
          type: string
          description: The worker pool (empty for the default pool), or the lowercase owner/name and runner label separated by a space.
        jobs:
          type: integer
          format: int64
          description: Finished jobs with anything recorded.
        sampled_jobs:
          type: integer
          format: int64
        oom_kills:
          type: integer
          format: int64
        cpu:
          $ref: '#/components/schemas/RightsizingResource'
        memory:
          $ref: '#/components/schemas/RightsizingResource'
    RightsizingReport:
      type: object
      required: [group, days, groups]
      properties:
        group:
          type: string
          enum: [pool, job]
        days:
          type: integer
        groups:
          type: array
          description: Most jobs first, at most 500 groups.
          items:
            $ref: '#/components/schemas/RightsizingGroup'
        truncated:
          type: boolean
    JobHistoryPage:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/HistoryJob'
        next:
          type: integer
          format: int64
          description: Pass as before to read the next older page; absent on the last page.
    Snapshot:
      type: object
      required: [fleet, runner_inventory, recent, poll_failed, polling, webhook, first_job_seen]
      properties:
        fleet:
          description: Null until the scheduler takes its first sample.
          oneOf:
            - $ref: '#/components/schemas/StatusReport'
            - type: 'null'
        runner_inventory:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Runner'
        recent:
          type: [array, 'null']
          description: Up to eight most recently cleaned jobs.
          items:
            $ref: '#/components/schemas/CompletedJob'
        sampled_at:
          type: string
          format: date-time
        last_webhook:
          type: string
          format: date-time
        last_poll:
          type: string
          format: date-time
        poll_failed:
          type: boolean
        polling:
          type: boolean
        webhook:
          type: boolean
        first_job_seen:
          type: boolean
        first_job_clean:
          $ref: '#/components/schemas/CompletedJob'
    StatusReport:
      type: object
      required: [schema_version, slot_limit, runners, hosts, jobs]
      properties:
        backend:
          type: string
        repository_scope:
          type: string
        public_repositories:
          type: boolean
          description: True when RUNQUILL_ALLOW_PUBLIC_REPOSITORIES lets jobs from public repositories run. Workflow runs from forks are always refused.
        schema_version:
          type: integer
        slot_limit:
          type: integer
        runners:
          description: Null when no runner host is known.
          oneOf:
            - $ref: '#/components/schemas/StatusRunners'
            - type: 'null'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/StatusHost'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/StatusJob'
        docker_error:
          type: string
    StatusRunners:
      type: object
      required: [known_running, occupied_slots, reserved_slots, unassigned_reserved_slots, offline_hosts]
      properties:
        known_running:
          type: integer
        occupied_slots:
          type: integer
        reserved_slots:
          type: integer
        unassigned_reserved_slots:
          type: integer
        offline_hosts:
          type: integer
    StatusHost:
      type: object
      required: [name, status, cordoned, slot_limit, occupied_slots, reserved_slots]
      properties:
        name:
          type: string
        pool:
          type: string
        status:
          type: string
          enum: [UP, UNAVAILABLE, OFFLINE]
        cordoned:
          type: boolean
        slot_limit:
          type: integer
        occupied_slots:
          type: integer
        reserved_slots:
          type: integer
        error:
          type: string
        image_status:
          type: string
          enum: [ready, pulling, missing, failed]
          description: Runner image readiness on a local or SSH host while RUNQUILL_IMAGE_PULL is missing or always.
        enrollment_available:
          type: boolean
          description: An administrator can issue a one-time code for this configured outbound worker.
        warm:
          type: integer
          description: Idle warm runners on this host, waiting for a job. Absent when there are none.
        warm_target:
          type: integer
          description: The warm runners its worker pool keeps on each local or SSH host. Absent when the pool keeps none or the host is an outbound worker.
    StatusJob:
      type: object
      required: [id, repository, status]
      properties:
        id:
          type: integer
          format: int64
        repository:
          type: string
        status:
          type: string
          examples: [WAITING, RETRY, STARTING, RUNNING, PAUSED, CLEANUP, OFFLINE, UNKNOWN]
        queue_position:
          type: integer
        retry_at:
          type: string
          format: date-time
        retry_reason:
          type: string
        runner:
          type: string
        runner_label:
          type: string
        diagnostic:
          $ref: '#/components/schemas/JobDiagnostic'
        runner_host:
          type: string
        pool:
          type: string
        pool_error:
          type: string
        runner_os:
          type: string
          description: OS NAME the runner label selects with os__NAME__ (for example ubuntu2204), when it selects one.
        runner_image:
          type: string
          description: Runner image the job's runner starts from, resolved from the current settings.
        url:
          type: string
        timing:
          $ref: '#/components/schemas/JobTiming'
    JobTiming:
      type: object
      properties:
        github_created_at:
          type: string
          format: date-time
        discovered_at:
          type: string
          format: date-time
        discovery_source:
          type: string
        provisioned_at:
          type: string
          format: date-time
        github_started_at:
          type: string
          format: date-time
        creation_to_discovery_seconds:
          type: integer
          format: int64
        runquill_queue_seconds:
          type: integer
          format: int64
        provision_to_start_seconds:
          type: integer
          format: int64
        jit_requested_at:
          type: string
          format: date-time
        jit_registered_at:
          type: string
          format: date-time
        runner_launch_at:
          type: string
          format: date-time
          description: When the runtime confirmed its launch request (Pod creation for Kubernetes).
        scheduler_wait_millis:
          type: integer
          format: int64
        jit_registration_millis:
          type: integer
          format: int64
        runtime_launch_millis:
          type: integer
          format: int64
        launch_to_github_start_seconds:
          type: integer
          format: int64
        github_completed_at:
          type: string
          format: date-time
          description: When GitHub reported the job completed.
        execution_seconds:
          type: integer
          format: int64
          description: GitHub's job start to its completion.
    JobDiagnostic:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Runner:
      type: object
      required: [name]
      properties:
        name:
          type: string
        host:
          type: string
        pool:
          type: string
        runtime_state:
          type: string
        job_id:
          type: integer
          format: int64
        runner_os:
          type: string
        runner_image:
          type: string
    CompletedJob:
      type: object
      required: [id, repository, cleaned_at]
      properties:
        id:
          type: integer
          format: int64
        repository:
          type: string
        runner_host:
          type: string
        pool:
          type: string
        url:
          type: string
        timing:
          $ref: '#/components/schemas/JobTiming'
        finished_at:
          type: string
          format: date-time
        cleaned_at:
          type: [string, 'null']
          format: date-time
    CordonRequest:
      type: object
      additionalProperties: false
      required: [host, cordoned]
      properties:
        host:
          type: string
          description: A host name from GET /snapshot fleet.hosts.
        cordoned:
          type: boolean
    DiagnoseRequest:
      type: object
      additionalProperties: false
      properties:
        repository:
          type: string
          description: Optional owner/name to include in the report.
    DiagnoseReport:
      type: object
      required: [ok, report]
      properties:
        ok:
          type: boolean
        report:
          type: string
    OperationSettings:
      type: object
      required: [backend, webhook_enabled, policy]
      properties:
        backend:
          type: string
        webhook_enabled:
          type: boolean
        policy:
          $ref: '#/components/schemas/OperationPolicy'
        runner_images:
          type: array
          description: Read-only runner image catalogue (built-in release variants and RUNQUILL_RUNNER_IMAGES) that workflows select with os__LABEL__.
          items:
            $ref: '#/components/schemas/RunnerImage'
    RunnerImage:
      type: object
      required: [name, label, image, source]
      properties:
        name:
          type: string
        label:
          type: string
          description: The NAME to write in os__NAME__ runner label selectors.
        image:
          type: string
        source:
          type: string
          enum: [release, default, configured]
    OperationPolicy:
      type: object
      additionalProperties: false
      required: [revision, slot_limit, poll_interval, runner_image, docker_hosts, host_limits, worker_pools]
      properties:
        revision:
          type: integer
          format: int64
          description: Send the revision you read; a stale revision answers 409.
        slot_limit:
          type: integer
        poll_interval:
          type: string
          description: Go duration such as 30s.
        runner_image:
          type: string
        docker_hosts:
          type: [array, 'null']
          items:
            type: string
        host_limits:
          type: [object, 'null']
          additionalProperties:
            type: integer
        worker_pools:
          type: [object, 'null']
          additionalProperties:
            $ref: '#/components/schemas/WorkerPool'
    WorkerPool:
      type: object
      additionalProperties: false
      required: [hosts, repositories, cpus, memory_mib, image]
      properties:
        hosts:
          type: [array, 'null']
          items:
            type: string
        repositories:
          type: [array, 'null']
          items:
            type: string
        cpus:
          type: number
        memory_mib:
          type: integer
          format: int64
        image:
          type: string
        privileged:
          type: boolean
        cache:
          type: boolean
        cache_writes:
          type: string
          enum: [all, default_branch]
          description: Which runs may write the shared cache. With default_branch, other runs get an empty cache that is removed with the runner. Absent means all, or default_branch for public repositories.
        max_per_repository:
          type: integer
        images:
          type: [array, 'null']
          description: Runner image catalogue names jobs in this pool may select with os__NAME__; absent allows every name.
          items:
            type: string
        warm:
          type: integer
          description: Started runners each local or SSH host in the pool keeps waiting for a job, 0 to 100; absent or 0 is off.
        warm_max_idle_minutes:
          type: integer
          description: Minutes after which an unused warm runner is replaced, 0 to 1440; absent or 0 uses 30.
    HostResourcesReport:
      type: object
      description: Host capacity, runner reservations, usage and disk use. A plain read runs no engine command beyond the cached engine probe; disk use appears only after a request with disk=1.
      required: [hosts, disk_measuring]
      properties:
        hosts:
          type: array
          description: One entry per configured Docker host in configuration order, or per Kubernetes target.
          items:
            $ref: '#/components/schemas/HostResources'
        disk_measured_at:
          type: string
          format: date-time
          description: When the cached disk measurement finished; absent before the first one.
        disk_measuring:
          type: boolean
          description: A disk measurement is still running; ask again with disk=1 to wait for it.
    HostResources:
      type: object
      required: [host]
      properties:
        host:
          type: string
        unavailable:
          type: string
          enum: [agent, kubernetes]
          description: The manager cannot read this host. agent is an outbound agent:// worker, kubernetes a K3s target. Capacity, usage and disk are absent, never zero.
        error:
          type: string
          description: The engine probe failed; capacity is absent.
        cpus:
          type: integer
          description: CPUs the engine reports. Absent when unavailable or the probe failed.
        memory_bytes:
          type: integer
          format: int64
          description: Memory the engine reports.
        reserved:
          $ref: '#/components/schemas/HostReservation'
        usage:
          $ref: '#/components/schemas/HostUsage'
        disk:
          $ref: '#/components/schemas/RunnerDiskUse'
        disk_error:
          type: string
          description: The last disk measurement failed on this host.
    HostReservation:
      type: object
      description: CPU and memory promised to runners holding a slot. When the elastic loop sampled the host, runners and the sums are the runners' current limits; otherwise the pool limit times occupied slots. Absent for Kubernetes.
      required: [runners, runner_cpus, runner_memory_bytes, cpus, memory_bytes]
      properties:
        runners:
          type: integer
        runner_cpus:
          type: number
          description: The pool's per-runner CPU limit; 0 leaves runners unlimited.
        runner_memory_bytes:
          type: integer
          format: int64
          description: The pool's per-runner memory limit; 0 leaves runners unlimited.
        cpus:
          type: number
        memory_bytes:
          type: integer
          format: int64
    HostUsage:
      type: object
      description: What runners used in the elastic loop's last sample. Present only for local hosts the loop samples, that is with RUNQUILL_ELASTIC set and a pool that sets cpus or memory_mib.
      required: [cpus, memory_bytes]
      properties:
        cpus:
          type: number
        memory_bytes:
          type: integer
          format: int64
    RunnerDiskUse:
      type: object
      required: [cache_volumes, images, image_bytes]
      properties:
        cache_volumes:
          type: integer
        cache_bytes:
          type: integer
          format: int64
          description: Absent when the engine cannot size volumes (Podman) or docker system df failed.
        images:
          type: integer
          description: Images Runquill pulled that are still on the host.
        image_bytes:
          type: integer
          format: int64
    ElasticReport:
      type: object
      description: State of the elastic runner limits loop. With RUNQUILL_ELASTIC unset or off, mode is off and the lists are empty.
      required: [mode, interval_seconds, hosts, runners, decisions]
      properties:
        mode:
          type: string
          enum: ['off', observe, apply]
        interval_seconds:
          type: number
          description: Configured sampling interval, reported even when mode is off.
        hosts:
          type: array
          description: Local Docker hosts whose pool sets cpus or memory_mib, ordered by host.
          items:
            $ref: '#/components/schemas/ElasticHostPlan'
        runners:
          type: array
          items:
            $ref: '#/components/schemas/ElasticRunner'
        decisions:
          type: array
          description: Up to 200 recent decisions, newest first.
          items:
            $ref: '#/components/schemas/ElasticDecision'
    ElasticHostPlan:
      type: object
      required: [host, cpus, memory_mib, held_slots, surplus_cpus, lent_cpus, surplus_memory_mib, extra_memory_mib]
      properties:
        host:
          type: string
        cpus:
          type: number
          description: CPUs the host reports.
        memory_mib:
          type: integer
          format: int64
        held_slots:
          type: integer
          description: Free slots whose guarantees are held back for queued jobs.
        surplus_cpus:
          type: number
          description: CPUs beyond every runner guarantee, held slot and the host reserve; negative when overcommitted.
        lent_cpus:
          type: number
          description: CPUs currently lent to runners above their guarantee.
        surplus_memory_mib:
          type: integer
          format: int64
        extra_memory_mib:
          type: integer
          format: int64
          description: Memory granted to runners above their guarantee.
        memory_overcommitted:
          type: boolean
          description: Present and true when granted extra memory exceeds the surplus. Memory is never taken back.
    ElasticRunner:
      type: object
      required: [host, runner, cpus, guarantee_cpus, memory_mib, guarantee_memory_mib, cpu_usage, memory_usage_mib]
      properties:
        host:
          type: string
        runner:
          type: string
        cpus:
          type: number
          description: Current CPU limit; 0 is unlimited.
        guarantee_cpus:
          type: number
          description: The pool's cpus value; 0 when the pool sets none.
        memory_mib:
          type: integer
          format: int64
          description: Current memory limit; 0 is unlimited.
        guarantee_memory_mib:
          type: integer
          format: int64
        cpu_usage:
          type: number
          description: Cores used over the last sample window.
        memory_usage_mib:
          type: number
    ElasticDecision:
      type: object
      required: [at, host, runner, resource, from, to, reason, applied]
      properties:
        at:
          type: string
          format: date-time
        host:
          type: string
        runner:
          type: string
        resource:
          type: string
          enum: [cpu, memory]
          description: cpu values are cores, memory values are MiB.
        from:
          type: number
        to:
          type: number
        reason:
          type: string
        forced:
          type: boolean
          description: Present and true for a CPU reclaim that restores the host reserve and skips the cooldown.
        applied:
          type: boolean
          description: False in observe mode or when Docker rejected the update.
        error:
          type: string
          description: Why Docker rejected the update.
    UsageTotals:
      type: object
      description: Finished jobs only. failed counts jobs Runquill gave up on or that were cancelled in the panel, not GitHub job conclusions. runner_seconds run from provisioning to runner cleanup. Waits run from queueing to provisioning (or to the failure for jobs that never got a runner); percentiles are interpolated within fixed histogram buckets.
      required: [jobs, failed, runner_seconds, wait_count, wait_avg_seconds, wait_p50_seconds, wait_p95_seconds]
      properties:
        jobs:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        runner_seconds:
          type: integer
          format: int64
        wait_count:
          type: integer
          format: int64
          description: Jobs with a known wait.
        wait_avg_seconds:
          type: integer
          format: int64
        wait_p50_seconds:
          type: integer
          format: int64
        wait_p95_seconds:
          type: integer
          format: int64
    UsageGroup:
      allOf:
        - $ref: '#/components/schemas/UsageTotals'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: A UTC day (YYYY-MM-DD), a lowercase owner/name, a pool or a host, by group. Pool and host are empty when unknown.
    UsageReport:
      type: object
      required: [from, to, group, totals, series]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        group:
          type: string
          enum: [day, repository, pool, host]
        totals:
          $ref: '#/components/schemas/UsageTotals'
        series:
          type: array
          description: By day, every day in the range in date order (days without jobs are zero). Otherwise busiest first, at most 500 groups.
          items:
            $ref: '#/components/schemas/UsageGroup'
        truncated:
          type: boolean
          description: Present and true when series was cut to 500 groups; totals still cover every group.
    MigrationError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: One English sentence.
        code:
          type: string
          enum: [permissions, stale, nothing, branch_exists, repository, scope, public, installation_scope, too_many, mapping, hash, github]
        pull_request:
          type: string
          description: With branch_exists, the URL of the open pull request for that branch, if any.
    MigrationStatus:
      type: object
      required: [ready, required, missing]
      properties:
        ready:
          type: boolean
          description: True when the installation grants every required permission.
        required:
          type: array
          items:
            type: string
          examples:
            - [contents, pull_requests, workflows]
        missing:
          type: array
          description: Required permissions the installation does not grant with write access.
          items:
            type: string
    RunsOnMapping:
      type: object
      additionalProperties: false
      required: [from]
      properties:
        from:
          type: array
          description: The runs-on label set to match, compared case-insensitively and in any order. GitHub-hosted labels only; self-hosted and runquill- labels and expressions are refused.
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 100
        pool:
          type: string
          description: Target worker pool; omit for default.
    MigrationRequest:
      type: object
      additionalProperties: false
      required: [repository, mapping]
      properties:
        repository:
          type: string
          description: OWNER/REPO owned by the configured account.
        mapping:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RunsOnMapping'
    MigrationOpenRequest:
      type: object
      additionalProperties: false
      required: [repository, mapping, hash]
      properties:
        repository:
          type: string
        mapping:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RunsOnMapping'
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The hash of the preview the administrator reviewed.
    MigrationJob:
      type: object
      required: [job, line, changed, code]
      properties:
        file:
          type: string
        job:
          type: string
        line:
          type: integer
        labels:
          type: array
          items:
            type: string
        changed:
          type: boolean
        runs_on:
          type: string
          description: The generated runs-on expression for a changed job.
        code:
          type: string
          enum: [changed, unmapped, expression, mapping, anchor, self-hosted, runquill, reusable-call, workflow-call, no-runs-on, unparseable, job-id]
        reason:
          type: string
    MigrationFile:
      type: object
      required: [path, changed, jobs]
      properties:
        path:
          type: string
          description: A .yml or .yaml file directly under .github/workflows.
        changed:
          type: boolean
        diff:
          type: string
          description: Unified diff of the proposed change.
        refused:
          type: string
          description: Why the whole file is left alone.
        jobs:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/MigrationJob'
    MigrationPreview:
      type: object
      required: [repository, base, head, hash, files]
      properties:
        repository:
          type: string
        base:
          type: string
          description: The default branch.
        head:
          type: string
          description: The default branch commit that was read.
        hash:
          type: string
          description: Covers the mapping and the proposed file contents; send it to POST /api/migrate/open.
        files:
          type: [array, 'null']
          description: Null when the repository has no workflow files.
          items:
            $ref: '#/components/schemas/MigrationFile'
    MigrationPullRequest:
      type: object
      required: [url, number, branch]
      properties:
        url:
          type: string
        number:
          type: integer
        branch:
          type: string
          description: runquill/migrate-runs-on- followed by 12 characters of the preview hash.
    BackupStatus:
      type: object
      required: [scheduled, sealing, remote, last]
      properties:
        scheduled:
          type: boolean
          description: True when RUNQUILL_BACKUP_INTERVAL is a duration of at least 1m.
        interval_seconds:
          type: number
        directory:
          type: string
          description: Absolute RUNQUILL_BACKUP_DIR as the manager sees it.
        keep:
          type: integer
          description: Local copies kept.
        sealing:
          type: boolean
          description: True when a backup passphrase or passphrase file is configured.
        remote:
          $ref: '#/components/schemas/BackupRemote'
        last:
          $ref: '#/components/schemas/BackupRun'
        verification:
          $ref: '#/components/schemas/BackupVerification'
    BackupVerification:
      type: object
      required: [name, checked_at, ok]
      properties:
        name:
          type: string
          description: File name of the local scheduled backup that was checked.
        checked_at:
          type: string
          format: date-time
        ok:
          type: boolean
          description: True if the backup passed the authentication, SQLite integrity and GitHub identity checks.
        error:
          type: string
          description: A non-sensitive reason when verification failed.
    BackupRemote:
      type: object
      description: S3-compatible upload settings, reported only when scheduled. No credentials are included.
      required: [configured, keep]
      properties:
        configured:
          type: boolean
        bucket:
          type: string
        endpoint_host:
          type: string
        region:
          type: string
        prefix:
          type: string
        keep:
          type: integer
          description: Remote copies kept; 0 never prunes.
    BackupRun:
      type: object
      description: Outcome of the latest scheduled backup since the manager started. Empty apart from sealed before the first run.
      required: [sealed]
      properties:
        last_attempt:
          type: string
          format: date-time
        last_success:
          type: string
          format: date-time
        name:
          type: string
          examples: [runquill-queue-20260101T000000Z.sqlite3.sealed]
        size:
          type: integer
          format: int64
        sealed:
          type: boolean
        error:
          type: string
          description: The latest failure, with secrets redacted.
        remote:
          type: string
          enum: [uploaded, failed]
        remote_at:
          type: string
          format: date-time
        remote_error:
          type: string
        remote_pending:
          type: integer
          description: Local backups still waiting for upload after a failure.
    RunnerLogUnavailable:
      type: object
      required: [error]
      properties:
        error:
          type: string
    JSONRPCMessage:
      type: object
      description: One JSON-RPC 2.0 request or notification. Batches (arrays) are refused.
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          description: A string of at most 256 characters or an integer of at most 16 digits. Omit it for a notification.
          type: [string, integer]
        method:
          type: string
          examples: [initialize, ping, server/discover, tools/list, tools/call]
        params:
          type: object
    JSONRPCResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          type: [string, integer]
          description: Absent when the request id could not be read.
        result:
          type: object
          description: A tool failure is a result with isError true, not a JSON-RPC error.
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: 'JSON-RPC error code: -32700 parse error, -32600 invalid request, -32601 method not found, -32602 invalid params, -32603 internal or busy, -32020 header mismatch, -32022 unsupported protocol version.'
            message:
              type: string
            data:
              description: For -32022, the supported and requested versions.
paths:
  /:
    get:
      operationId: getPanelPage
      tags: [assets]
      summary: Panel HTML page.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          description: The panel page.
          content:
            text/html:
              schema:
                type: string
  /panel.css:
    get:
      operationId: getPanelCSS
      tags: [assets]
      summary: Panel stylesheet.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Asset'
  /theme.js:
    get:
      operationId: getPanelThemeJS
      tags: [assets]
      summary: Applies the saved light or dark theme before the page paints.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Asset'
  /app.js:
    get:
      operationId: getPanelAppJS
      tags: [assets]
      summary: The panel shell with sign-in, navigation, routing and live updates.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Asset'
  /api.js:
    get:
      operationId: getPanelApiJS
      tags: [assets]
      summary: Panel API client module.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Asset'
  /ui.js:
    get:
      operationId: getPanelUIJS
      tags: [assets]
      summary: Shared panel interface helpers.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Asset'
  /fleet.js:
    get:
      operationId: getPanelFleetJS
      tags: [assets]
      summary: Fleet snapshot helpers shared by panel screens.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Asset'
  /i18n.js:
    get:
      operationId: getI18nJS
      tags: [assets]
      summary: Korean and English panel text.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Asset'
  /demo.js:
    get:
      operationId: getDemoJS
      tags: [assets]
      summary: Example fleet snapshots, served only by runquill panel --demo.
      x-runquill-permission: public
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Asset'
  /views/{file}:
    get:
      operationId: getPanelView
      tags: [assets]
      summary: One panel screen as an ES module (views/<id>.js).
      x-runquill-permission: public
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*\.(js|css)$'
      responses:
        '200':
          $ref: '#/components/responses/Asset'
        '400':
          description: Not a panel file name.
        '404':
          description: No such panel view.
  /demo/{file}:
    get:
      operationId: getPanelDemoData
      tags: [assets]
      summary: Sample responses for one panel screen, served only by runquill panel --demo.
      x-runquill-permission: public
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*\.(js|css)$'
      responses:
        '200':
          $ref: '#/components/responses/Asset'
        '400':
          description: Not a panel file name.
        '404':
          description: No such sample data, or a live panel.
  /auth/github:
    get:
      operationId: startGitHubSignIn
      tags: [auth]
      summary: Starts GitHub OAuth with PKCE and sets the short-lived, encrypted rq_oauth cookie holding the state and verifier.
      x-runquill-permission: public
      security: []
      responses:
        '302':
          description: Redirect to github.com/login/oauth/authorize.
  /auth/github/callback:
    get:
      operationId: finishGitHubSignIn
      tags: [auth]
      summary: GitHub OAuth callback; on success sets the session cookie.
      x-runquill-permission: public
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
      responses:
        '303':
          description: Signed in; redirect to /.
        '400':
          description: 'State missing or expired ("Sign-in expired. Return to the panel and try again." or "Sign-in expired or cancelled. Return to the panel and try again.").'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Body "Your GitHub account is not enrolled in this Runquill panel."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 'Body "Could not verify the GitHub login. Try again."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'Body "Could not start a panel session."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user.
      x-runquill-permission: browser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Ends the session and clears its cookie. Audited as session.logout.
      x-runquill-permission: browser
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 'Body "Could not end the session." or "Could not check panel access."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/team:
    get:
      operationId: listTeam
      tags: [team]
      x-runquill-permission: admin
      security:
        - sessionCookie: []
      parameters:
        - name: after
          in: query
          description: Last GitHub account ID from the previous page.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        '200':
          description: Up to 100 enrolled members ordered by GitHub ID. A response with fewer than 100 members means there are no more members.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/TeamMember'
        '400':
          description: Invalid GitHub account ID cursor.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
    post:
      operationId: addTeamMember
      tags: [team]
      summary: Enrolls or re-enables a member by GitHub login. Audited as user.set.ROLE.
      x-runquill-permission: admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberCreate'
      responses:
        '200':
          description: The member as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Body "No GitHub user has this login."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/NotJSON'
        '502':
          description: 'Body "Could not look up the GitHub account. Try again or enter the numeric ID."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/team/{id}:
    put:
      operationId: setTeamMember
      tags: [team]
      summary: Sets a member's role and disabled flag, creating the row if needed. Audited as user.set.ROLE or user.disable.
      x-runquill-permission: admin
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: GitHub account ID.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberUpdate'
      responses:
        '204':
          description: Updated.
        '400':
          $ref: '#/components/responses/BadJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Body "At least one active administrator is required."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/NotJSON'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: Unexpired tokens, newest first, at most 100. Administrators see every member's tokens.
      x-runquill-permission: browser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Tokens without secrets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
    post:
      operationId: createToken
      tags: [tokens]
      summary: Creates an API token for the signed-in user. Audited as token.create.
      x-runquill-permission: browser
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
        '400':
          description: 'Body "Invalid JSON request." or "Use a token name and an expiry between 1 and 90 days."'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Body "Choose a token scope that your role permits.", "Your panel permissions changed. Reload and try again.", or a generic Forbidden message.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/NotJSON'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revokes one of your tokens (administrators may revoke any). Audited as token.revoke.
      x-runquill-permission: browser
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AccessUnavailable'
  /api/audit:
    get:
      operationId: listAudit
      tags: [operations]
      summary: Audit log, newest first.
      x-runquill-permission: admin
      security:
        - sessionCookie: []
      parameters:
        - name: action
          in: query
          description: Exact action, or a prefix when it ends with a dot (user.). At most 64 bytes.
          schema:
            type: string
            maxLength: 64
        - name: actor
          in: query
          description: Numeric GitHub ID or login, optionally prefixed with @.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          description: Page size; values above 200 are reduced to 200.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: before
          in: query
          description: Return entries with an id below this one.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
