name: Image builds

on:
  workflow_call:
    inputs:
      publish:
        description: Push tested images and save the manager binaries for a release
        type: boolean
        default: false

# CI grants read access to source and prior runs. Releases grant package writes.
env:
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  VERSION: ${{ inputs.publish && github.ref_name || 'dev' }}
  IMAGE_LABELS: |
    org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
    org.opencontainers.image.revision=${{ github.sha }}

jobs:
  changes:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      variants: ${{ steps.paths.outputs.variants }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          base="$PR_BASE"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$FORCED" != true ]; then
            # A superseded push might never have checked its runner changes.
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.run_number < '"$GITHUB_RUN_NUMBER"' and .event == "push")] | max_by(.run_number) | .head_sha // empty') || base=
          fi
          variants=true
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] &&
            { git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"; } &&
            git diff --quiet "$base" HEAD -- runner/ .github/workflows/{ci,images,release}.yml; then
            variants=false
          fi
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

  runtime:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: image
        if: inputs.publish
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build manager
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: runquill-manager:ci
          labels: ${{ env.IMAGE_LABELS }}
          build-args: |
            VERSION=${{ env.VERSION }}
            RELEASE_IMAGE=${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=manager-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=manager-{0},ignore-error=true', matrix.arch) || '' }}
      - name: Build default runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: runquill-runner:ci
          labels: ${{ env.IMAGE_LABELS }}
          cache-from: type=gha,scope=runner-ubuntu24.04-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope=runner-ubuntu24.04-{0},ignore-error=true', matrix.arch) || '' }}
      - name: Check the manager binary and embedded panel
        run: |
          test "$(docker run --rm runquill-manager:ci --version)" = "$VERSION"
          docker run --rm --entrypoint sh runquill-manager:ci -c \
            'runquill panel --demo --port 8081 & sleep 2; wget -q -O /dev/null http://127.0.0.1:8081/views/overview.js'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Exercise nested Docker
        env:
          RUNQUILL_TEST_DOCKER_IMAGE: runquill-runner:ci
        run: go test -run '^TestDockerRunner$' -v -timeout 5m
      - name: Exercise the K3s runner lifecycle and host maintenance
        if: matrix.arch == 'amd64'
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 -o "$RUNNER_TEMP/k3d"
          printf '%s  %s\n' 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0 "$RUNNER_TEMP/k3d" |
            sha256sum --check -
          chmod 0755 "$RUNNER_TEMP/k3d"
          K3D="$RUNNER_TEMP/k3d" bash .github/scripts/smoke-k3s.sh
      - name: Push the tested native images
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag runquill-manager:ci "$IMAGE:$VERSION-$ARCH"
          docker tag runquill-runner:ci "$IMAGE-runner:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH" &
          manager_push=$!
          docker push "$IMAGE-runner:$VERSION-$ARCH"
          wait "$manager_push"
      - name: Extract the tested native binary
        if: inputs.publish
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          container=$(docker create runquill-manager:ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/runquill" "$RUNNER_TEMP/runquill-linux-$ARCH"
          test "$("$RUNNER_TEMP/runquill-linux-$ARCH" --version)" = "$VERSION"
      - name: Save the native binary
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runquill-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/runquill-linux-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  variants:
    needs: changes
    if: ${{ !cancelled() && (inputs.publish || needs.changes.outputs.variants != 'false') }}
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.publish && '["amd64", "arm64"]' || '["amd64"]') }}
        os: [ubuntu22.04, ubuntu26.04, debian12, debian13]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: runquill-runner:ci
          labels: ${{ env.IMAGE_LABELS }}
          build-args: RUNQUILL_RUNNER_OS=${{ matrix.os }}
          cache-from: type=gha,scope=runner-${{ matrix.os }}-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope=runner-{0}-{1},ignore-error=true', matrix.os, matrix.arch) || '' }}
      - name: Check the runner user and binaries
        run: |
          docker run --rm --entrypoint bash runquill-runner:ci -ec \
            'test "$(id -u runner):$(id -g runner)" = 1001:1001; runuser -u runner -- ./bin/Runner.Listener --version; dockerd --version'
      - name: Push the tested native image
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          RUNNER_OS: ${{ matrix.os }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-runner:$VERSION-$RUNNER_OS-$ARCH"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag runquill-runner:ci "$image"
          docker push "$image"
