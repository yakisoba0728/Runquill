name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      checks-only:
        description: Run source and installer checks while release builds its images
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the installer with stubbed commands
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sh -n install.sh
          dash -n install.sh
          if command -v shellcheck >/dev/null; then
            shellcheck -s sh install.sh .github/scripts/smoke-public-install.sh \
              .github/scripts/test-install-offline.sh .github/scripts/test-install-host.sh
          else
            echo '::warning::shellcheck is not installed on this runner'
          fi
          sh .github/scripts/test-install-offline.sh dash
          sh .github/scripts/test-install-offline.sh bash
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        if: matrix.os == 'ubuntu-24.04'
        run: test -z "$(gofmt -l .)"
      - if: matrix.os == 'ubuntu-24.04'
        run: go vet ./...
      - name: Check for known Go vulnerabilities
        if: matrix.os == 'ubuntu-24.04'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: go test -race ./...
      - name: Prepare a fresh Ubuntu host with the installer
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 10
        run: sh .github/scripts/test-install-host.sh ubuntu:24.04

  docker-upgrade:
    if: ${{ !inputs.checks-only && github.repository == 'yakisoba0728/Runquill' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Rehearse the Docker upgrade using a known pair of releases
        run: python3 .github/scripts/smoke-docker-upgrade.py v0.3.4 v0.4.0

  images:
    if: ${{ !inputs.checks-only }}
    uses: ./.github/workflows/images.yml
    permissions:
      actions: read
      contents: read
