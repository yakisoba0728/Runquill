name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Check for known Go vulnerabilities
        if: matrix.os == 'ubuntu-24.04'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: go test -race ./...
      - name: Build both Docker images
        run: |
          docker build -t runquill-manager:ci .
          docker run --rm runquill-manager:ci --version
          docker build -t runquill-runner:ci runner
      - name: Exercise nested Docker
        env:
          RUNQUILL_TEST_DOCKER_IMAGE: runquill-runner:ci
        run: go test -run '^TestDockerRunner$' -v -timeout 5m
