name: Publish Runquill

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the release version
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'

  verify:
    uses: ./.github/workflows/ci.yml
    with:
      checks-only: true
    permissions:
      actions: read
      contents: read

  build:
    needs: tag
    uses: ./.github/workflows/images.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write

  publish:
    needs: [verify, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish multi-architecture tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          pushes=()
          for tag in "$image:$GITHUB_REF_NAME" "$image-runner:$GITHUB_REF_NAME" \
            "$image-runner:$GITHUB_REF_NAME-ubuntu22.04" "$image-runner:$GITHUB_REF_NAME-ubuntu26.04" \
            "$image-runner:$GITHUB_REF_NAME-debian12" "$image-runner:$GITHUB_REF_NAME-debian13"; do
            docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64" &
            pushes+=("$!")
          done
          for push in "${pushes[@]}"; do
            wait "$push"
          done

  release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runquill-linux-*
          path: release-assets
          merge-multiple: true
      - name: Assemble release files and checksums
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          chmod +x release-assets/runquill-linux-amd64 release-assets/runquill-linux-arm64
          test "$(release-assets/runquill-linux-amd64 --version)" = "$GITHUB_REF_NAME"
          cp compose.yaml compose.ssh.yaml compose.panel.yaml compose.worker.yaml install.sh LICENSE release-assets/
          sed -e "s#ghcr.io/yakisoba0728/runquill:#$image:#" \
              -e "s#ghcr.io/yakisoba0728/runquill-runner:#$image-runner:#" \
              -e "s#:\(v[0-9][0-9.]*\)\$#:$GITHUB_REF_NAME#" \
            deploy/k3s/runquill.yaml > release-assets/runquill-k3s.yaml
          source_date=$(git show -s --format=%ct HEAD)
          tar --sort=name --mtime="@$source_date" --owner=0 --group=0 --numeric-owner \
            -czf release-assets/runquill-panel-demo.tar.gz LICENSE -C internal/webui panelweb
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(release-assets/*)
          if existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            for asset in "${assets[@]}"; do
              name=${asset##*/}
              if grep -Fxq -- "$name" <<< "$existing"; then
                gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir existing-assets --pattern "$name"
                cmp -- "$asset" "existing-assets/$name"
              else
                gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            flags=(--verify-tag --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi

  verify-public-installer:
    # The public installer downloads assets from the canonical repository.
    if: github.repository == 'yakisoba0728/Runquill'
    needs: release
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the public release in a clean Linux container
        run: |
          docker run --rm \
            --volume "$PWD/.github/scripts/smoke-public-install.sh:/smoke.sh:ro" \
            alpine:3.23 sh -ec 'apk add --no-cache curl && sh /smoke.sh "$1"' -- "$GITHUB_REF_NAME"
      - name: Upgrade the previous public release and finish its queued job on a new worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/smoke-docker-upgrade.py "$GITHUB_REF_NAME"
