name: Publish Runquill

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and push native images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$GITHUB_REF_NAME-$ARCH"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform "linux/$ARCH" --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg "VERSION=$GITHUB_REF_NAME" -t "$image:$tag" .
          # The default runner tag is the Ubuntu 24.04 variant; other bases get a suffixed tag.
          for os in ubuntu24.04 ubuntu22.04 debian12; do
            suffix="-$os"
            if [[ "$os" == ubuntu24.04 ]]; then suffix=; fi
            docker buildx build --platform "linux/$ARCH" --push \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "RUNQUILL_RUNNER_OS=$os" \
              -t "$image-runner:$GITHUB_REF_NAME$suffix-$ARCH" runner
          done

  publish:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish multi-architecture tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$image:$GITHUB_REF_NAME" "$image-runner:$GITHUB_REF_NAME" \
            "$image-runner:$GITHUB_REF_NAME-ubuntu22.04" "$image-runner:$GITHUB_REF_NAME-debian12"; do
            docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"
          done

  release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build standalone binaries
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir release-assets
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -buildvcs=false -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME -X main.releaseImage=$image" \
              -o "release-assets/runquill-linux-$arch" .
          done
          test "$(release-assets/runquill-linux-amd64 --version)" = "$GITHUB_REF_NAME"
          cp compose.yaml compose.ssh.yaml compose.panel.yaml compose.worker.yaml install.sh LICENSE release-assets/
          sed -e "s#ghcr.io/yakisoba0728/runquill:#$image:#" \
              -e "s#ghcr.io/yakisoba0728/runquill-runner:#$image-runner:#" \
              -e "s#:\(v[0-9][0-9.]*\)\$#:$GITHUB_REF_NAME#" \
            deploy/k3s/runquill.yaml > release-assets/runquill-k3s.yaml
          source_date=$(git show -s --format=%ct HEAD)
          tar --sort=name --mtime="@$source_date" --owner=0 --group=0 --numeric-owner \
            -czf release-assets/runquill-panel-demo.tar.gz panelweb LICENSE
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(release-assets/*)
          if existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            for asset in "${assets[@]}"; do
              name=${asset##*/}
              if grep -Fxq -- "$name" <<< "$existing"; then
                gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir existing-assets --pattern "$name"
                cmp -- "$asset" "existing-assets/$name"
              else
                gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            flags=(--verify-tag --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi

  verify-public-installer:
    # The public installer downloads assets from the canonical repository.
    if: github.repository == 'yakisoba0728/Runquill'
    needs: release
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the public release in a clean Linux container
        run: |
          docker run --rm \
            --volume "$PWD/.github/scripts/smoke-public-install.sh:/smoke.sh:ro" \
            alpine:3.23 sh -ec 'apk add --no-cache curl && sh /smoke.sh "$1"' -- "$GITHUB_REF_NAME"
