services:
  manager:
    environment:
      RUNQUILL_PANEL_ADDR: "0.0.0.0:8081"
      RUNQUILL_PANEL_URL: "${RUNQUILL_PANEL_URL:-http://127.0.0.1:8081}"
      RUNQUILL_PANEL_GITHUB_CLIENT_ID: "${RUNQUILL_PANEL_GITHUB_CLIENT_ID:-}"
      RUNQUILL_PANEL_GITHUB_CLIENT_SECRET: "${RUNQUILL_PANEL_GITHUB_CLIENT_SECRET:-}"
      RUNQUILL_PANEL_BOOTSTRAP_ID: "${RUNQUILL_PANEL_BOOTSTRAP_ID:-}"
    ports:
      - "127.0.0.1:8081:8081"
