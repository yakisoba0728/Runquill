<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Runquill's operations panel for GitHub Actions jobs, runner capacity and team access.">
  <title>Runquill</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./panel.css">
  <script src="./theme.js"></script>
  <script src="./app.js" type="module"></script>
</head>
<body data-mode="demo">
  <a class="skip" href="#main" id="skip">Skip to content</a>

  <div class="signin" id="sign-in" hidden>
    <main class="signin-box" aria-labelledby="signin-title">
      <p class="brand">runquill</p>
      <h1 id="signin-title" tabindex="-1">Sign in to Runquill</h1>
      <p class="muted">Use the GitHub account your Runquill administrator enrolled.</p>
      <p id="signin-message" class="signin-message" role="alert" hidden></p>
      <a class="button primary signin-button" href="./auth/github">Continue with GitHub</a>
      <dl class="signin-meta">
        <dt>Panel address</dt><dd id="signin-host" class="mono"></dd>
      </dl>
      <div class="signin-controls">
        <a class="language-toggle" href="?lang=ko" lang="ko">한국어</a>
        <label><span class="visually-hidden">Appearance</span>
          <select data-theme-control>
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>
    </main>
  </div>

  <div class="shell" id="shell" hidden>
    <header class="topbar">
      <a class="brand" href="#/overview">runquill</a>
      <button class="button menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
      <p class="connection">
        <span class="state" id="connection-state" data-state="" role="status">Connecting</span>
        <span class="muted" id="connection-age"></span>
      </p>
      <div class="topbar-controls">
        <button class="palette-open" id="palette-open" type="button" aria-haspopup="dialog" aria-controls="palette"><span>Commands</span> <kbd id="palette-key">Ctrl K</kbd></button>
        <a class="language-toggle" href="?lang=ko" lang="ko">한국어</a>
        <label><span class="visually-hidden">Appearance</span>
          <select data-theme-control>
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <span class="who" id="who" hidden></span>
        <button class="button" id="signout" type="button" hidden>Sign out</button>
      </div>
    </header>

    <div class="demo-bar" id="demo-bar" hidden>
      <label>Scenario
        <select id="scenario">
          <option value="first">First job</option>
          <option value="missed">Webhook missed</option>
          <option value="offline">Worker offline</option>
        </select>
      </label>
      <span class="muted" id="scenario-note"></span>
      <a href="https://github.com/yakisoba0728/Runquill#install-a-public-release" target="_blank" rel="noopener noreferrer">Install Runquill</a>
    </div>

    <nav class="nav" id="nav" aria-label="Panel"></nav>

    <main class="main" id="main" tabindex="-1">
      <div class="notices" id="notices"></div>
      <div class="view" id="view"></div>
    </main>
  </div>

  <dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-text">
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button class="button" type="button" id="confirm-cancel">Cancel</button>
      <button class="button primary" type="button" id="confirm-ok">Confirm</button>
    </div>
  </dialog>
  <dialog class="palette" id="palette" role="dialog" aria-modal="true" aria-labelledby="palette-title">
    <h2 class="visually-hidden" id="palette-title">Commands</h2>
    <input class="palette-input" id="palette-input" type="text" role="combobox" aria-expanded="true" aria-autocomplete="list"
      aria-controls="palette-list" aria-label="Search screens, commands, runners, jobs and hosts" placeholder="Type a screen, command, runner, job or host"
      autocomplete="off" autocapitalize="off" spellcheck="false">
    <ul class="palette-list" id="palette-list" role="listbox" aria-label="Commands"></ul>
    <div class="palette-foot">
      <p id="palette-status" role="status" aria-live="polite"></p>
      <p class="palette-hint" aria-hidden="true">↑ ↓ to move, Enter to open, Esc to close</p>
    </div>
  </dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
